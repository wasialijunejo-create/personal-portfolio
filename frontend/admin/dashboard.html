<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin Dashboard | Abdul Wasio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top">
      <h1>Admin Dashboard</h1>
      <div class="row-actions">
        <a class="btn btn-ghost btn-small" href="../index.html" target="_blank" rel="noopener">View site</a>
        <button class="btn btn-ghost btn-small" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="stats">
      <div class="card stat"><b id="statProjects">-</b>Projects</div>
      <div class="card stat"><b id="statMessages">-</b>Messages</div>
      <div class="card stat"><b id="statUnread">-</b>Unread</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="projectsPanel">Projects</button>
      <button class="tab" data-panel="messagesPanel">Messages</button>
    </div>

    <!-- Projects panel -->
    <section id="projectsPanel" class="panel active">
      <form id="projectForm" class="card form" novalidate>
        <h2 id="projectFormTitle">Add project</h2>
        <input type="hidden" id="projectId" />
        <label for="pTitle">Title</label>
        <input id="pTitle" maxlength="120" required />
        <label for="pDesc">Description</label>
        <textarea id="pDesc" rows="3" maxlength="1000" required></textarea>
        <label for="pTech">Tech stack (comma separated)</label>
        <input id="pTech" maxlength="200" />
        <label for="pRepo">GitHub repository URL</label>
        <input id="pRepo" type="url" placeholder="https://github.com/..." required />
        <label for="pLive">Live demo URL (optional)</label>
        <input id="pLive" type="url" placeholder="https://..." />
        <div class="row-actions">
          <button class="btn btn-primary" type="submit">Save project</button>
          <button class="btn btn-ghost" type="button" id="cancelEdit" hidden>Cancel edit</button>
        </div>
        <p id="projectStatus" class="form-status" role="status"></p>
      </form>

      <div class="card table-wrap mt">
        <table>
          <thead><tr><th>Title</th><th>Repository</th><th>Actions</th></tr></thead>
          <tbody id="projectRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Messages panel -->
    <section id="messagesPanel" class="panel">
      <div class="card table-wrap">
        <table>
          <thead><tr><th>From</th><th>Subject / Message</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="messageRows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
